<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图文版课程</title>
<link rel="stylesheet" href="assets/cc.css">
<style>
.wrap{max-width:900px;margin:0 auto;padding:0 24px 80px}
.courses{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.course{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.course .ic{font-size:30px;line-height:52px;text-align:center;background:var(--bg);border-radius:12px;height:52px}
.course a.title{color:var(--ink);text-decoration:none}
.course a.title:hover .zh{color:var(--accent)}
.course .zh{font-size:18px;font-weight:700}
.course .sub{font-size:14px;color:var(--muted);margin-top:2px}
.course .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.course .meta a{color:var(--muted)}
.prog{display:inline-block;width:120px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;vertical-align:middle}
.prog i{display:block;height:100%;width:0;background:var(--ok)}
.extra-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.extra-links a{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--ink);text-decoration:none;background:var(--bg)}
.extra-links a:hover{border-color:var(--accent);color:var(--accent)}
@media (max-width:600px){.wrap{padding:0 16px 60px}.course{grid-template-columns:40px minmax(0,1fr);padding:12px 14px}.course .ic{font-size:22px;line-height:40px;height:40px}}
</style>
</head>
<body>
<header class="hero" style="max-width:900px">
  <div class="eyebrow">ILLUSTRATED COURSES · 图文版课程</div>
  <h1>图文版课程</h1>
  <p class="lead">把视频课程整理成可以"读"的网页：正文据原课字幕整理，讲解顺序和例子来自原课；视频里不好讲清楚的地方，配上手绘示意图和可以动手点的演示。不方便看视频的时候，读这个。</p>
</header>
<div class="wrap">
  <ol class="courses" id="courses"></ol>
  <div class="credit">
    各门课的原作、字幕来源和授权协议，写在各自的目录页和每篇文章末尾。图文版的示意图、交互演示与补充内容由 Claude Opus 5.5（Anthropic）制作，仅供个人学习。
  </div>
</div>
<script src="assets/cc.js"></script>
<script>
// 新增一门课：在这里加一项（href 指向课程目录页，key 是它的打卡 localStorage 键，total 是篇数）
const COURSES = [
  {
    href: 'cs/index.html', icon: '💻', key: 'cc-read', total: 47,
    title: '计算机科学速成课 · 图文版',
    sub: 'Crash Course Computer Science：40 集原课逐集整理，外加 7 集原创续集讲 2017 年之后的新变化。',
    video: 'https://www.bilibili.com/video/BV1ZQ4y1W7rF',
    extras: [],
  },
  {
    href: 'java/index.html', icon: '☕', key: 'hm-java-read', total: 64,
    title: 'Java 入门到起飞 · 图文版',
    sub: '黑马程序员 Java 零基础视频教程（上部）：200 集按话题整理成 64 篇：概念精讲，练习做成题单，偏门内容略读。',
    video: 'https://www.bilibili.com/video/BV17F411T7Ao/',
    extras: [],
  },
];
$('#courses').innerHTML = COURSES.map(c => {
  const read = new Set(ccStore.get(c.key, [])).size;
  const pct = Math.min(100, Math.round(read / c.total * 100));
  return `<li class="course">
    <div class="ic">${c.icon}</div>
    <div>
      <a class="title" href="${c.href}"><div class="zh">${c.title}</div><div class="sub">${c.sub}</div></a>
      <div class="meta"><span><span class="prog"><i style="width:${pct}%"></i></span>　已读 ${read} / ${c.total} 篇</span><a href="${c.video}" target="_blank" rel="noopener">原视频 ↗</a></div>
      ${c.extras.length ? `<div class="extra-links">${c.extras.map(([h, t]) => `<a href="${h}">${t}</a>`).join('')}</div>` : ''}
    </div>
  </li>`;
}).join('');
</script>
</body>
</html>
